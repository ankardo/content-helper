name: ci

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build and test
        run: ./mvnw -B verify
      - name: Upload SBOM
        uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: target/classes/META-INF/sbom/application.cdx.json
