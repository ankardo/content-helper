name: osv-scan

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build SBOM
        run: ./mvnw -B -DskipTests package
      - name: Install osv-scanner
        run: |
          curl -sSL https://github.com/google/osv-scanner/releases/latest/download/osv-scanner_linux_amd64 -o osv-scanner
          chmod +x osv-scanner
      - name: Scan dependencies
        run: |
          ./osv-scanner scan \
            -L target/classes/META-INF/sbom/application.cdx.json \
            --format markdown --output-file osv-report.md || true
          cat osv-report.md
      - name: Upload report
        uses: actions/upload-artifact@v7
        with:
          name: osv-report
          path: osv-report.md
