spring.application.name=content-helper
# Local model through LM Studio (OpenAI compatible). No key needed, anything goes.
spring.ai.openai.api-key=noop
spring.ai.openai.base-url=http://localhost:1234/v1
spring.ai.openai.chat.options.model=meta/muse-glimmer
# Roomy budget: reasoning models think before they answer.
spring.ai.openai.chat.options.max-tokens=6000
# Some warmth: greedy decoding latches onto misreadings (temp 0 read "wired"
# the verb as Wired the magazine and never recovered). Drafts get edited anyway.
spring.ai.openai.chat.options.temperature=0.7
# Bound a slow or hung model so the fallback is reached in time, not after an
# open ended wait. Resilience4j owns the timeout and the retry (a bounded retry
# with a fixed backoff); the OpenAI SDK retry is turned off so there is a single
# retry owner instead of two stacked layers.
content-helper.model.timeout=30s
content-helper.model.retry-attempts=3
content-helper.model.retry-delay=500ms
# The SDK retry is disabled: the OpenAI client honours max-retries, so leaving
# it on would multiply with the Resilience4j retry above.
spring.ai.openai.max-retries=0
spring.ai.openai.timeout=180s
spring.ai.openai.chat.timeout=180s
spring.ai.openai.chat.options.timeout=180s
