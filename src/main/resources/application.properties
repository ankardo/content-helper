spring.application.name=content-helper
# Local model through LM Studio (OpenAI compatible). No key needed, anything goes.
spring.ai.openai.api-key=noop
spring.ai.openai.base-url=http://localhost:1234/v1
spring.ai.openai.chat.options.model=meta/muse-glimmer
# Roomy budget: reasoning models think before they answer.
spring.ai.openai.chat.options.max-completion-tokens=2000
# Some warmth: greedy decoding latches onto misreadings (temp 0 read "wired"
# the verb as Wired the magazine and never recovered). Drafts get edited anyway.
spring.ai.openai.chat.options.temperature=0.7
